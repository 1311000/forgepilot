# ✅ **This workflow has run.** The first real run — 38139694497, on the push that gave the
# repository its remote — was **green in both jobs, 42 s and 43 s**: `ruff` clean,
# `1053 passed, 217 skipped`, 922 of 7718 statements missed (**88.05%** against the 85 bar),
# `All gates passed.` in `check`; the container suite `2 passed`, `--sandbox-check` exiting 1
# for the default profile and 0 where containment is real, and `31 passed, 1 skipped` in
# `sandbox`. It has been green on every push since, and the most recent one — 38140873105, on
# the force-push that carried the rewritten history — is the first whose `check` counts differ:
# **`1045 passed, 218 skipped`**, because `CLAUDE.md` is no longer in the checkout and the guard
# over it skips as a single module instead of running its eight assertions. Coverage is
# unchanged at 88.05%: those assertions are about prose, not statements.
# See `docs/notes/gates-on-linux.md`. The workflow is deliberately thin: install
# the package and call the same entry a person calls (`tools/check.py`), so a local green run
# and a CI green run cannot be measuring different things.
#
# ⚠️ **The first run was green; the one skip in it is a finding, and it is the one this file
# predicted.** `test_a_write_outside_the_workspace_is_refused` — the test the namespace
# provider exists for — is hardcoded to the `wsl` transport, so on the runner it skips with a
# reason that names the transport rather than the kernel, exactly as its docstring said the
# first Linux run would confirm. The real-kernel evidence therefore comes from the
# `--privileged` container step, whose suite *does* execute. A later skip for a *different*
# reason is a finding about code that was previously only asserted about, not a broken
# pipeline — the `sandbox` job's step is named for that.
#
# ⚠️ **`runs-on` is pinned rather than `-latest`, and the pin is not cosmetic.** The
# runner image decides the kernel's namespace policy, and a *security* claim about the
# sandbox rests on it — `ubuntu-latest` moving from 22.04 to 24.04 would change what a
# green run means, with no edit to this repository. What the pin means in practice was
# settled by the first run: the native boundary is not exercised on `ubuntu-22.04` (the
# skip above), so the `sandbox` job's container step is where containment is executed, and
# whether an unprivileged runner could run the native transport at all stays open — see
# `CLAUDE.md` under "The runner is pinned".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # ⚠️ **The only job here that is not a push gate.** `evals/matrix.py` runs the eight
  # offline arms over the ten tasks — the harness's own shapes, not the agent — and
  # compares the verdicts with the table measured on 2026-10-18. It costs nothing (the
  # replay model reads no files) and it is the only eval a schedule can afford: the
  # question the arms exist to answer needs `--live`, money and a credential CI does not
  # have. Weekly rather than per-push because a mechanism's offline verdict should not
  # change with an unrelated commit; `workflow_dispatch` so it can be asked on demand.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The **declared floor** (`requires-python = ">=3.12"`) rather than the
          # development box's 3.14: the gate should hold on the oldest interpreter a
          # deployment is allowed to use. A 3.14 job can be added when the runners have
          # it; adding one now would produce a red build for a reason that has nothing
          # to do with the change, and a gate that fails for an unrelated reason is a
          # gate people stop reading.
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      # ⚠️ `web` and `ast` are installed **on purpose**, and leaving them out is not a
      # neutral choice. With only `[dev]`:
      #   * `tests/httpapi/conftest.py:28` does `pytest.importorskip("fastapi")`, so the
      #     whole HTTP/SSE surface — M10's routing, auth and streaming tests — skips on
      #     the platform that *has* it installed locally (this Windows box has fastapi,
      #     uvicorn and sse-starlette), i.e. the production platform would run *less*
      #     than the dev box;
      #   * `tests/review/test_review_mode.py:356-364` skips the AST test without
      #     tree-sitter, and tree-sitter publishes no Windows cp314 wheel — so the AST
      #     path would run *nowhere at all*, which is what the header above claims this
      #     workflow fixes.
      # First run of this job is the verification of that claim.
      - run: python -m pip install -e ".[dev,web,ast]"

      - run: python tools/check.py

  # `tools/check.py` runs the whole suite, so it *does* collect the sandbox tests — and
  # on a runner they come out as **skips**, which is the failure mode this job exists to
  # make visible: a check that cannot run is not a pass, and a green gate that rested on
  # those skips would be claiming containment nothing had verified.
  #
  # ⚠️ Until the reorder recorded in `CLAUDE.md` (N1) they did not even skip: the test
  # prepared its workspace over `wsl` *before* reaching its own probe guard, so on Linux
  # it raised `FileNotFoundError` — this job would have died before printing the very
  # reason it exists to print, and the `check` job would have gone red on a test that
  # measured nothing. Written, not yet run: the first run here is what says so.
  sandbox:
    runs-on: ubuntu-22.04
    env:
      # `tests/providers/test_namespace_sandbox_container.py` is gated on this (and on
      # `docker version` succeeding). It is the instrument that *can* verify containment
      # on a runner: it enters a real Linux kernel through a privileged container rather
      # than trying to create namespaces as the unprivileged `runner` user. The image
      # needs util-linux `mount` (busybox's fails with `can't find /etc in /proc/mounts`);
      # `ubuntu:24.04` already carries it, so nothing is downloaded. ⚠️ `redis:7.4.2-alpine`
      # was the earlier choice and installs it with `apk`: measured, when the CDN is not
      # reachable that does not fail, it hangs for the whole 600 s `subprocess` timeout, so
      # the failure reads as a sandbox verdict rather than as a missing package.
      FORGEPILOT_SANDBOX_CONTAINER: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: containment, against a real kernel (privileged container)
        # `-rs`: on this host the two non-root tests **skip**, with the kernel's own refusal
        # (`cannot change root filesystem propagation`) as the reason — and a skip without its
        # reason is a count, which is the failure mode this job exists to make visible.
        run: python -m pytest tests/providers/test_namespace_sandbox_container.py -v -rs

      # ⚠️ **The invariant that holds on every host.** The default profile's sandbox is the
      # *recording* one: it never executes, so it enforces nothing, and `--sandbox-check`
      # must refuse it. This is the failure mode the command exists to catch — `--boot`
      # reports that the row **loaded**, which is a different claim, and the kernel-sandbox
      # row loaded for as long as its boundary confined writes and not reads (finding 20).
      - name: the check refuses a sandbox that enforces nothing
        run: |
          if python -m forgepilot --config-dir configs --sandbox-check; then
            echo "::error::--sandbox-check passed for the recording sandbox, which never executes"
            exit 1
          fi

      # ⚠️ **And where containment is real, it must pass** — the same command, the same exit
      # status an operator's pipeline reads. Measured on this recipe before it was written
      # here (`.tmp/p2_sandbox_check.sh`, `ubuntu:24.04 --privileged`): `read_scope: host`
      # and `read_scope: workspace` both print `probe: full`, run the shell command, and
      # exit 0, while the default profile exits 1. The in-container install is deliberate:
      # a venv outside the boundary's named toolchain set is masked, so a check command
      # would die `command not found` rather than report anything.
      - name: the same check where containment is real (privileged container)
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv util-linux >/dev/null
            mkdir -p /w && tar -C /src -cf - . | tar -C /w -xf -
            cd /w
            python3 -m venv /v
            /v/bin/pip install -q -e ".[dev]"
            /v/bin/python -m forgepilot --config-dir configs \
              --patch src/forgepilot/bundles/kernel_sandbox/patch.yaml --sandbox-check
          '

      # ⚠️ **A `SKIPPED` here is a finding, not a pass.** `-rs` prints the reason, and the
      # first run supplied it: `31 passed, 1 skipped`, the skip naming the **transport** —
      # `no namespace boundary on this host: the transport 'wsl' is missing` — rather than
      # the kernel. That was one of the two candidates recorded in `CLAUDE.md`; the other
      # (`build_argv` builds mount/pid/net namespaces with no user namespace, so it needs
      # root or `CAP_SYS_ADMIN`) is the reason a different transport is not a config change.
      # Read the reason before reading anything into a green job.
      - name: the native kernel sandbox (a skip here is not a pass)
        run: python -m pytest tests/providers/test_namespace_sandbox.py -v -rs

  # ⚠️ **The question neither job above can answer, asked on a host kernel instead of in a
  # container.** Both of those run on `ubuntu-22.04`, and the containment they execute is
  # bought with `--privileged` — so neither says whether an *unprivileged* process can build
  # this boundary on the Ubuntu release a deployment is told to use. This job runs the native
  # transport as a non-root user on a **24.04 host kernel**, once with AppArmor's
  # unprivileged-user-namespace restriction at its default and once with it lifted, so the
  # before/after pair comes out of one run rather than out of an argument.
  #
  # Written before it has run, and the split is deliberate: the "before" step records what
  # this runner's kernel actually says and asserts **only** what follows from that reading —
  # a kernel reporting `1` must produce a refusal that names the sysctl, and a 24.04 image
  # that permits unprivileged user namespaces anyway is a finding (logged, not a red build).
  # The "after" step is a gate: the containment test has to *run* there, and a skip is not a
  # pass. See `docs/notes/gates-on-linux.md` for what the first run of this job said.
  sandbox-nonroot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      # Evidence first: which kernel is this, and does it claim to restrict unprivileged
      # user namespaces? `|| echo absent` because the sysctl is *absent* on kernels that do
      # not restrict them, and absent is not `0` — the distinction M12's Phase B is built on.
      - name: the evidence — what this kernel says
        run: |
          uname -a
          echo "apparmor_restrict_unprivileged_userns: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"

      # Somewhere to write that is not `/tmp`: the boundary replaces `/tmp` with a fresh
      # tmpfs as its last mount rule, so a workspace prepared there is bound and then hidden
      # again, and the launcher's `cd` exits 126 (N1 — measured, and the reason the
      # containment fixture now lives in a home directory).
      - name: a non-root user, with a home to work in
        run: |
          sudo useradd --create-home --shell /bin/bash runner2
          sudo install -d -o runner2 -g runner2 -m 700 /home/runner2/tmp
          id runner2

      # ⚠️ Not a gate, and its first run is why it exists: `sandbox-check` died with `No module
      # named forgepilot.cli` while the same interpreter ran it fine as `runner`, and the answer was
      # permissions — the checkout lives under `/home/runner`, and a home directory is not
      # world-traversable, so every path into the source tree was *silently* unusable for `runner2`
      # (the importer skips a directory it cannot enter; it does not complain). `sys.path.insert`
      # and `PYTHONPATH` both pointed straight at it, and both did nothing — which is what made it
      # look like a Python mystery instead of an `ls -ld` on two ancestor directories.
      - name: what a non-root user can actually see
        run: |
          set +e
          probe='import importlib.util as u, os; s = u.find_spec("forgepilot"); print("PYTHONPATH =", os.environ.get("PYTHONPATH")); print("forgepilot ->", s.origin, list(s.submodule_search_locations or [])); print("forgepilot.__main__ found:", u.find_spec("forgepilot.__main__") is not None)'
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "--- can runner2 even reach the checkout? (asked as runner2) ---"
          sudo -u runner2 ls -ld /home/runner /home/runner/work "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/src"
          echo "--- as runner2, before the fix ---"
          sudo -u runner2 env HOME=/home/runner2 TMPDIR=/home/runner2/tmp PYTHONPATH="$GITHUB_WORKSPACE/src" "$(command -v python)" -c "$probe"

          # The fix is about the *directory chain*, not the files: traverse-only on the two
          # ancestors (`o+x`, deliberately not `o+r`, so the home is not listable), read for the
          # checkout itself. An ephemeral single-tenant CI VM is where loosening this is cheap; a
          # deployment puts the checkout somewhere a non-root user can already reach.
          sudo chmod o+x /home/runner /home/runner/work
          sudo chmod -R o+rX "$GITHUB_WORKSPACE"

          echo "--- as runner2, after the fix ---"
          sudo -u runner2 env HOME=/home/runner2 TMPDIR=/home/runner2/tmp PYTHONPATH="$GITHUB_WORKSPACE/src" "$(command -v python)" -c "$probe"

      # Not a gate: the point is the *pair* with the next step. What it does assert is the
      # conditional one — if this kernel says `1` and the check fails, the refusal has to name
      # `kernel.apparmor_restrict_unprivileged_userns` and report the AppArmor cause. That is
      # acceptance row 4, and it is checkable wherever the condition holds.
      - name: before — as shipped, as a non-root user on a 24.04 host
        run: |
          # ⚠️ The source tree is named *inside the interpreter*, not in the environment. The
          # interpreter that `sudo -u runner2` runs is the same one, but what it can import is not
          # the same thing — `python -m forgepilot` resolved to a `forgepilot` without `__main__`
          # here while working in both local interpreters. `sys.path.insert(0, …)` is not a
          # workaround for an unexplained failure, it is the difference between measuring this
          # checkout and measuring whatever happens to be installed next to the interpreter.
          run_as_runner2() {
            sudo -u runner2 env PATH="$PATH" HOME=/home/runner2 TMPDIR=/home/runner2/tmp \
              "$(command -v python)" "$@"
          }
          cli() {
            run_as_runner2 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/src'); from forgepilot.cli.main import main; raise SystemExit(main())" "$@"
          }

          set +e
          out=$(cli --config-dir configs \
            --patch src/forgepilot/bundles/kernel_sandbox/patch.yaml --sandbox-check 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "sandbox-check exit: $code"

          # Distinguish "the sandbox refused" from "the check never ran". The first CI run reported
          # the second as the first — an import failure became a claim about a kernel — and the
          # guard below is what makes that impossible to do again.
          if echo "$out" | grep -qE "No module named|ModuleNotFoundError|Traceback \(most recent call last\)"; then
            echo "::error::the check did not run at all: this is an instrument failure, not a sandbox refusal"
            exit 1
          fi

          flag=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)
          if [ "$flag" = "1" ] && [ "$code" != "0" ]; then
            if ! echo "$out" | grep -q "kernel.apparmor_restrict_unprivileged_userns"; then
              echo "::error::this kernel reports apparmor_restrict_unprivileged_userns=1 and the refusal does not name it"
              exit 1
            fi
            if ! echo "$out" | grep -q "cause        : apparmor_restricts_userns"; then
              echo "::error::the refusal's cause is not the AppArmor one, yet the sysctl reads 1"
              exit 1
            fi
          elif [ "$code" = "0" ]; then
            echo "::notice::unprivileged user namespaces are permitted here as shipped; the pair below will be identical"
          fi

      # The gate. `sysctl -w` is the host decision the refusal tells an operator to make, and
      # doing it here is what turns "the message is right" into "the boundary is buildable".
      - name: after — the same commands with the restriction lifted
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          # Same reasoning as the step above: the checkout is named in the interpreter.
          run_as_runner2() {
            sudo -u runner2 env PATH="$PATH" HOME=/home/runner2 TMPDIR=/home/runner2/tmp \
              "$(command -v python)" "$@"
          }
          pytest_as_runner2() {
            run_as_runner2 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/src'); import pytest; raise SystemExit(pytest.main(sys.argv[1:]))" "$@"
          }
          cli() {
            run_as_runner2 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE/src'); from forgepilot.cli.main import main; raise SystemExit(main())" "$@"
          }

          set +e
          out=$(pytest_as_runner2 \
            tests/providers/test_namespace_sandbox.py -v -rs -p no:cacheprovider --no-header 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" != "0" ]; then
            echo "::error::the unprivileged run failed (exit $code)"
            exit 1
          fi
          if [ "$(echo "$out" | grep -c SKIPPED || true)" != "0" ]; then
            echo "::error::a test skipped in the unprivileged run — a skip here is not a pass"
            exit 1
          fi

          set +e
          out=$(cli --config-dir configs \
            --patch src/forgepilot/bundles/kernel_sandbox/patch.yaml --sandbox-check 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" != "0" ]; then
            echo "::error::--sandbox-check exited $code for a non-root user whose boundary the probe just built"
            exit 1
          fi
          if ! echo "$out" | grep -q "mechanism    : map-root"; then
            echo "::error::the check passed without saying how the capability was obtained"
            exit 1
          fi

  # ⚠️ **The one job that measures the harness rather than the code — and says so.**
  # `evals/matrix.py` runs every arm over every task with `--scripted` (the replay model:
  # no network, no credential, nothing spent) and then compares the result with the table
  # measured on 2026-10-18: 78 of 80 cells pass, and the two that do not are `two-attempts`
  # under `baseline` and `no-repair`, which is exactly what that task exists to say. The
  # value is not the number — a scripted run measures no capability — it is that the shapes
  # this harness claims to distinguish are still distinguished after a week of changes.
  #
  # `FORGEPILOT_HOME` points outside the checkout so the session stores and workspaces the
  # run creates land in `RUNNER_TEMP`; `FORGEPILOT_TMP` pins `tempfile` for the same reason
  # M15 pinned it. Both are exported by a step rather than written into `jobs.<id>.env`,
  # because **the `runner` context does not exist there** — GitHub rejects the file with
  # `Unrecognized named-value: 'runner'` at parse time, which is a red run with **zero
  # jobs** rather than a failing step. A local `yaml.safe_load` accepts it; only a
  # `workflow_dispatch` says why. The results file lands in `evals/results/`, which is
  # gitignored, and is deliberately not uploaded: a green run's artifact is this log.
  evals:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: state outside the checkout
        run: |
          echo "FORGEPILOT_HOME=$RUNNER_TEMP/forgepilot-home" >> "$GITHUB_ENV"
          echo "FORGEPILOT_TMP=$RUNNER_TEMP/forgepilot-workspaces" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: the offline matrix, against the verdicts this repository recorded
        run: python evals/matrix.py