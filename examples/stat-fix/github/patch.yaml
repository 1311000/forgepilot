# The GitHub deployment: the fixture, but the work lands on a real repo host.
#
# Self-contained rather than composed with `../patch.yaml`, on purpose: a demo
# that must be read as three layers is a demo people get wrong. The cost is that
# the rows both patches share — the classifier, the sandbox, the credential — are
# written twice, and a change to one will not reach the other. That is worth it
# here and would not be worth it in a deployment's own profile.
#
# The difference from the local example is one row that matters: `vcs` is a real
# repo host, so the task ends at `DELIVERED` instead of `READY`.
#
# `seed_github.py` prints the exports this file needs.

- id: classifier
  plugin: forgepilot.providers.classify.llm:LLMClassifierPlugin
  config:
    model: ${FORGEPILOT_LLM_MODEL:-deepseek-flash}
    max_tokens: 2048
  tier: trusted

- id: tickets
  plugin: forgepilot.providers.tickets.file:FileTicketSourcePlugin
  config:
    root: examples/stat-fix/github/tickets
  tier: trusted

# ⚠️ **The mirror path is derived, and two rows must agree on it.** `vcs` builds
# it from the slug — `<mirror_root>/<host>/<namespace>/<name>` — and `workspace`
# has to cut its worktree from exactly that directory, so it is spelled out here
# too. Nothing checks that the two agree.
#
# It could not be otherwise without changing a seam: `Workspace.prepare(repo,
# base_ref, session_id)` names a repository, not a directory, and `workspace` and
# `vcs` may not reach each other (a provider importing a provider is the one
# thing the import-graph test forbids). So the composition happens in
# configuration, which is where this project puts composition — and where a
# mistake is a pathspec error rather than a silent wrong answer.
- id: workspace
  plugin: forgepilot.providers.workspace.git_worktree:GitWorktreeWorkspacePlugin
  config:
    repos:
      github.com/1311000/test: ${FORGEPILOT_EXAMPLE_MIRRORS}/github.com/1311000/test
    worktree_root: ${FORGEPILOT_EXAMPLE_WORKTREES}
    branch_prefix: forgepilot
  tier: trusted

# `code_search` does **not** search this path, and that is the fix rather than an
# oversight: the tool passes the session's working tree, because a repository's
# location and the checkout a session is editing are different questions. This
# entry is here to name the slug — `Retriever.repositories()` enumerates them, and
# `code_search` intersects that with the caller's grant before searching anything.
#
# It was originally pointed at the mirror *and searched there*, which on a bare
# mirror meant searching nothing and reporting "no match" — indistinguishable
# from "that symbol does not exist". A real run lost eleven shell calls to it.
- id: retriever
  plugin: forgepilot.providers.retrieve.grep:GrepRetrieverPlugin
  config:
    roots:
      github.com/1311000/test: ${FORGEPILOT_EXAMPLE_MIRRORS}/github.com/1311000/test
  tier: trusted

# The row this whole example exists for. `remote_base` and `api_base` default to
# github.com and api.github.com; an enterprise host is two lines here and nothing
# else anywhere.
- id: vcs
  plugin: forgepilot.providers.vcs.github:GitHubVcsPlugin
  config:
    mirror_root: ${FORGEPILOT_EXAMPLE_MIRRORS}
    # token_env defaults to FORGEPILOT_GITHUB_TOKEN. Named, never valued — a
    # token written here would land in git and in `--dump-config`.
  tier: trusted

- id: sandbox
  plugin: forgepilot.providers.sandbox.local:LocalProcessSandboxPlugin
  config:
    max_output_bytes: 64000
  tier: trusted

# ⚠️ **Publishing now really does ask a human, and this example has nobody to
# ask.** The base bundle lists `open_pr` under `ask_operations`, and since P1-9
# that is enforced rather than decorative — `run_task` consults policy before it
# pushes or opens anything. With no answerer registered, the ask resolves to
# `UNAVAILABLE`, everything except `allowed-once` refuses, and the task stops at
# **`READY`**: checks passed, commit made, nothing published, draft ready.
#
# That is the correct outcome and a perfectly good demonstration of its own. This
# file turns it off because the point of *this* example is the other half — the
# branch landing on a real host and a pull request a reviewer can open.
#
# To see the ask instead, delete this row and run it: the run ends at `READY`
# with `pullRequest: null`, and the session log shows the `approval/asked` event
# that nobody answered. Wiring a real answerer is a deployment's job — the
# approval service takes one, and the workbench UI is where a person clicks.
- id: policy
  plugin: forgepilot.identity.policy:PolicyServicePlugin
  config:
    default: allow
    ask_operations: []
  tier: trusted

- id: principal
  plugin: forgepilot.identity.principal:PrincipalServicePlugin
  config:
    tokens:
      - token: demo-token
        principal_id: demo
        tenant_id: local
        teams: []
        operations:
          - read_code
          - write_code
          - run_tests
          - read_ticket
          - open_pr
        repo_prefixes:
          - github.com/1311000/*
        writable_paths:
          - "."
        # Intersected with the project's own value, so both must say `allow`.
        network: allow
  tier: trusted
