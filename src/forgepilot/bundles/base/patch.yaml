# ForgePilot base bundle — the seam wiring every profile inherits.
#
# Rows marked `disabled: true` name the plugin that will fill the seam but whose
# implementation has not landed yet. They stay in the file rather than being
# omitted, so `--dump-config` shows the intended shape and the gap is visible
# instead of implied.
#
# Swap a capability by overriding a row id in a later layer; never by editing a
# consumer. That is what makes the seam swappable.

# --- model -----------------------------------------------------------------
# Replay rather than a live model: deterministic, offline, no credentials. This
# is the provider CI runs against.
- id: llm
  plugin: forgepilot.providers.llm.replay:ReplayLLMPlugin
  config:
    model: replay-1
  tier: trusted

# --- context compaction ----------------------------------------------------
# The conversation lives in the log and grows every step, so a long run reaches
# the model's window and — before this row existed — simply failed there.
# `providers/compaction/tiered.py` masks old tool-result bodies first (no model
# call, and roughly 84% of what grows), then summarises whole turns if that was
# not enough. Nothing here is required: a profile without this row keeps the
# loud `ContextWindowExceeded` failure and nothing else changes.
#
# The defaults below are written out rather than left implicit, because the two
# thresholds are the ones a deployment will actually want to tune:
#   trigger_fraction  compress at 80% of the window
#   reserve_tokens    ...or as soon as 8k is all that is left, whichever is first
- id: compaction
  plugin: forgepilot.providers.compaction.tiered:TieredCompactionPlugin
  config:
    trigger_fraction: 0.8
    reserve_tokens: 8192
    keep_recent_turns: 2
    keep_recent_tool_results: 4
    failure_limit: 3
  tier: trusted

# --- code retrieval --------------------------------------------------------
# Real search over real checkouts: ripgrep, the same thing Claude Code does. It
# replaced a mock that returned canned hits, which meant nothing in the system
# had ever searched a file.
#
# `roots` maps a repository slug to where its checkout lives, and is empty here
# because a shipped default cannot know a deployment's paths. Empty is the loud
# option: a search for an unconfigured repository raises and names the repository
# and the roots it does have. The alternative — returning no hits — is
# indistinguishable from "the symbol does not exist", which is how a caller ends
# up confidently wrong.
#
# ⚠️ In the target environment (GVFS: 300GB+, metadata-only locally) this
# provider's scope is the *overlay* — the branch diff and uncommitted changes, a
# small fully-materialised set — not global search. Global search is the
# enterprise index behind the same `Retriever` Protocol; see the note below.
- id: retriever
  plugin: forgepilot.providers.retrieve.grep:GrepRetrieverPlugin
  config:
    roots: {}
  tier: trusted

# --- plugging in an enterprise retriever ------------------------------------
# There is deliberately **no row here for one**, and there used to be: a
# `retriever-remote` row pointing at
# `forgepilot.providers.retrieve.remote_index` — a module that does not exist.
# Nobody noticed, because `--dump-config` never imports (by design) and `--boot`
# skips disabled rows. A row that names a plugin nobody implemented is a claim,
# not a placeholder.
#
# That module exists now, under its real name, with the bundle that enables it:
# `forgepilot.providers.retrieve.remote:RemoteIndexRetrieverPlugin` in
# `bundles/retriever_remote/`. It is not in this file because it needs a service
# URL and a token, so a deployment opts in (`tests/contract/test_the_index_seam.py`
# keeps it out of every shipped profile).
#
# Adding your own is a later layer overriding this row id:
#
#   - id: retriever
#     plugin: your.org.forgepilot.EnterpriseIndexRetriever
#     config:
#       endpoint: ${FORGEPILOT_SEARCH_ENDPOINT}
#     tier: trusted        # or `third-party` — see the tier rules
#
# The contract to satisfy is `forgepilot/seams/retriever.py`: `capabilities()`
# (say `supports_remote=True` and whether results cover the working tree),
# `search` / `symbols` / `open`, **every hit carrying the ref it came from**, and
# every effectful method re-checking `ExecutionConstraints` itself rather than
# trusting its caller. A provider that returns hits without refs cannot be used
# for editing, because a caller on a branch cannot tell trunk from their own work.

# --- identity and authorisation --------------------------------------------
# Identity answers "who is this"; policy answers "may they do this here". Neither
# is authority on its own — `identity/constraints.py` intersects the two and signs
# the result, and only a signed set can open a request scope.
- id: principal
  plugin: forgepilot.identity.principal:PrincipalServicePlugin
  tier: trusted

- id: policy
  plugin: forgepilot.identity.policy:PolicyServicePlugin
  config:
    # ⚠️ **`allow`, and the previous value was a trap.** This read `deny`, on the
    # reasoning that "an operation nobody granted is not permitted by omission" —
    # but *granting* is not this service's job. It never sees the grant: that
    # lives in `ExecutionConstraints`, narrowed by `derive` and enforced by the
    # guards and by `ToolDefinition.required_operation`. A `deny` here meant
    # **every tool call refused**, because `read_file` maps to `read_code`, which
    # nobody had listed.
    #
    # Nobody noticed because nothing called `decide()` — the service was written,
    # tested and never wired. It is wired now, and a shipped config that refuses
    # everything is exactly the kind of thing that reaches production looking
    # deliberate. `tests/identity/test_policy_is_wired.py` fails if this flips
    # back.
    #
    # Policy's job is the *call-time* question the grant cannot answer: does this
    # particular act need a person?
    default: allow
    # Operations that always need a human, whatever the grant says. An approval
    # is one-shot, and no answer is a refusal.
    ask_operations:
      # Publishing — pushing the branch and opening the pull request. Authorised
      # together, because they are one step: nothing is pushed unless a pull
      # request is about to be opened.
      - open_pr
      # Forgetting and purging a memory. Both need a human: the first because a
      # memory that stops being recalled is a change to what the system believes
      # it knows, and the second because it is the only irreversible act here —
      # the content is gone and the audit can only say that it *was* there.
      - forget_memory
      - purge_memory
  tier: trusted

# --- ticket understanding ---------------------------------------------------
# The seam the company's own model is meant to fill. It ships as a classifier
# that **always declines**: a keyword heuristic pretending to classify would look
# like it worked and would blur the distinction this seam exists to demonstrate —
# that the model produces *understanding* and the harness produces *decisions*.
#
# Declining means "unknown", and unknown means ask a human. Never guess.
- id: classifier
  plugin: forgepilot.providers.classify.stub:NullClassifierPlugin
  tier: trusted

# --- work item and repository ---------------------------------------------
- id: tickets
  plugin: forgepilot.providers.tickets.mock:MockTicketSourcePlugin
  tier: trusted

- id: vcs
  plugin: forgepilot.providers.vcs.mock:MockVcsPlugin
  tier: trusted

- id: workspace
  plugin: forgepilot.providers.workspace.local:LocalTempWorkspacePlugin
  tier: trusted

# --- persistence -----------------------------------------------------------
# Append-only JSONL, one file per session. Uncompressed on purpose: when a run
# goes wrong, grepping the timeline is worth more than the disk. Swap to the
# in-memory store (`...session_store.memory:InMemorySessionStorePlugin`) for a
# throwaway run — the seam makes that a one-line change.
- id: session
  plugin: forgepilot.providers.session_store.jsonl:JsonlSessionStorePlugin
  config:
    # Beyond this, an event payload spills to a sidecar blob losslessly rather
    # than growing a single log line without bound.
    inline_limit: 65536
  tier: trusted

- id: memory
  plugin: forgepilot.providers.memory.memory:InMemoryMemoryStorePlugin
  tier: trusted

# How far each session's log has been distilled (M11b Phase C). Durable on
# purpose: the process that distils a session is rarely the process that ran it,
# and never the next one. Without it a periodic distillation would re-extract —
# and re-pay for — every session it has already seen.
- id: distillation
  plugin: forgepilot.providers.distillation.watermark:JsonlWatermarkPlugin
  config:
    # Empty means `$FORGEPILOT_HOME/watermarks.jsonl`. The file is created on the
    # first watermark written, so booting a profile writes nothing.
    path: ""
  tier: trusted

# The credential channel: a command writes `${NAME}`, `arm` confirms the name is
# declared, and the value is substituted into the argv at the last moment — so the
# value never enters the conversation, the log or an event. Empty by default, and
# an undeclared name is **refused in `arm`** rather than run with an empty secret
# in it. Declare the names a deployment needs, e.g. `github_token: FORGEPILOT_GITHUB_TOKEN`.
- id: credentials
  plugin: forgepilot.providers.credentials.env:EnvCredentialPlugin
  config:
    entries: {}
  tier: trusted

# --- execution and safety --------------------------------------------------
# Reports `none` enforcement and records calls without executing them. A real
# host-backed provider must replace this before anything runs a command, and
# profiles that require containment must refuse to start while enforcement is
# weaker than `full`.
- id: sandbox
  plugin: forgepilot.providers.sandbox.recording:RecordingSandboxPlugin
  config:
    mode: workspace-write
    network: deny
    enforcement: none
  tier: trusted

- id: approval
  plugin: forgepilot.runtime.approval:ApprovalServicePlugin
  config:
    # fail-closed: an unanswered ask is a refusal.
    policy: ask
  tier: trusted
  # No answerer is wired here, so any `ask` resolves to UNAVAILABLE and the call
  # is refused. That is the correct default for a headless skeleton; a UI supplies
  # an answerer at M10. Swap in
  # `forgepilot.providers.approval.scripted:ScriptedApprovalPlugin` to script one.

# --- not yet implemented ---------------------------------------------------
# These name the intended implementation so the seam is visible in the dump.

# The tool registry is the catalog; it refuses to execute anything unless a
# pipeline is attached, so approval, guards and the sandbox cannot be skipped.
- id: tools
  plugin: forgepilot.runtime.tools.registry:ToolRegistryPlugin
  tier: trusted

# The shipped tools. Depends on `tools` and `sandbox`, so it stays PENDING — and
# registers nothing — on a host without a sandbox.
- id: tools-builtin
  plugin: forgepilot.runtime.tools.builtin:BuiltinToolsPlugin
  tier: trusted

# `code_search`, in its own plugin because it needs a different service.
#
# Separate so that a host with no retriever loses *search* rather than losing
# every tool — `read_file` does not become unavailable because `code_search` has
# nothing to talk to. Each plugin declares the services its own tools actually
# need, and fail-closed then means "this tool is absent" instead of "the tool set
# is absent".
- id: tools-search
  plugin: forgepilot.runtime.tools.builtin:CodeSearchToolPlugin
  tier: trusted

# The table of agent engines this deployment can run. `agent-loop` registers
# itself here, and the loop is then selected **by key** — so replacing the
# built-in engine with the company's own is a patch line, not a refactor. Order
# matters: the registry must exist before the loop that injects it.
- id: agents
  plugin: forgepilot.runtime.loop.agent_loop:AgentFactoryRegistry
  tier: trusted

- id: agent-loop
  plugin: forgepilot.runtime.loop.agent_loop:ForgePilotAgentLoopPlugin
  config:
    engine: forgepilot
    # Bounds looping rather than cost: a model calling a cheap tool forever stays
    # inside a healthy-looking budget while burning wall-clock.
    max_steps: 12
  tier: trusted
