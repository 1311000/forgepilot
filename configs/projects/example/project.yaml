# Example project configuration.
#
# ⚠️ This format is an invention — the design doc calls for a "fixed
# build/test/repair workflow" without defining how one is described. Confirm it
# against whatever the teams actually use before it becomes load-bearing.
#
# Copy to your own project directory and adjust.

name: svc-a
default_branch: main

repos:
  - git.corp/team/svc-a

# What this project permits. Absent means "nothing", not "everything" — a
# project that forgot to say is not thereby an open project.
allowed_operations:
  - read_code
  - write_code
  - run_tests
  - open_pr
writable_paths:
  - src
# `deny` is honoured by a backend that can honour it: the Linux namespace sandbox
# runs the command in its own network namespace. It is **not** enforceable by
# `providers/sandbox/local.py`, which contains nothing — and that backend now
# *refuses* a policy asking it to restrict the network rather than accepting it and
# ignoring it, because a boundary the model is told about and nobody applies is
# worse than no boundary: the model reasons from it. A development deployment using
# `bundles/local_exec` must say `allow` here *and* in the caller's grant (the two
# are intersected); the refusal names both.
network: deny

# The repair loop's commands, and how far it may retry before giving up.
build:
  - make build
test:
  - pytest -q
lint:
  - ruff check .
retry:
  max_attempts: 2
  on_failure: stop

# Which tool set a category runs with. The classifier picks a *name*; what that
# name means is decided here, which is what bounds a model's influence over tool
# selection to "choose one of the sets someone already approved".
tool_sets:
  # A question is answered by reading and searching; it needs no write access.
  default:
    - read_file
    - list_dir
    - glob
    - code_search
    - read_code
  bugfix:
    - read_file
    - list_dir
    - glob
    - code_search
    - read_code
    - write_file
    # Targeted replace. Prefer this to `write_file` for a change to an existing
    # file: it edits one place instead of re-emitting the whole file, and it refuses
    # an ambiguous or unmatched search rather than guessing. `write_file` stays for
    # a new file or a wholesale rewrite.
    - edit_file
    # Several exact edits as one decision: if any of them no longer matches,
    # nothing is written, so a change across files never lands half-applied.
    - apply_patch
    # The plan, recorded where the log can see it: the answer is the list, so a
    # later turn reads it back through the projection like any other result.
    - todo_write
    - run
category_tool_sets:
  bug: bugfix
  question: default

budget:
  max_tool_calls: 60
  max_tokens: 150000
