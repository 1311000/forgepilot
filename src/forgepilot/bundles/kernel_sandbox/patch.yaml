# Kernel-sandbox bundle — the deployment-shaped counterpart to `local_exec`.
#
# This is the provider a real deployment wants. It runs commands inside Linux
# namespaces and read-only bind mounts, and `probe()` reports `full` **only after
# actually creating one** — so `arm` hands out `exec` without the operator having
# to lower anything. No `--allow-uncontained-exec`, no warning.
#
# Why it is not the default, and cannot be: the recording sandbox it replaces
# never executes, and that is the reason a profile can be *loaded* anywhere. This
# one needs a Linux kernel, so a default profile carrying it would fail to boot on
# a developer's Windows machine. Production is Linux; so is this row.
#
#   forgepilot --config-dir configs \
#     --patch src/forgepilot/bundles/kernel_sandbox/patch.yaml \
#     --chat
#
# What it enforces, per call:
#
#   `/` read-only · workspace writable · `.git` read-only again (a hook written
#   there would run later, outside the sandbox) · a fresh tmpfs on `/tmp` ·
#   private pid/ipc/uts namespaces · the network namespace cut unless the policy
#   allows it.
#
# ⚠️ **Writes, not reads — which is why this row says `read_scope: host`.** `/` is
# bound read-only, so it is *visible*: a sandboxed command can read every file the
# filesystem hands it, including a checkout it was never asked to touch. Measured,
# not inferred (finding 20, `docs/notes/evals.md`): inside this boundary
# `cat /eval/evals/tasks/not-in-the-checkout/index.json` succeeds and prints the
# task. `host` claims exactly that much and `probe()` verifies it with a write the
# boundary must refuse.
#
# **`workspace` is now enforceable, and is opt-in because it costs something.** With
# it, the launcher replaces every top-level entry the boundary does not name with an
# empty tmpfs (`/dev/null` over a file), keeping the workspace and a named toolchain
# set (`/usr /bin /sbin /lib /lib64 /lib32 /libx32 /etc /dev /proc`) — so a read
# outside the workspace fails, and `/etc` and `/dev` remain a documented residual.
# The probe checks *that* claim with a read instead of a write, and answers `partial`
# for a boundary that only confines writes, which this provider then refuses to run
# under. Turn it on when the checkout is not the whole world: `/tmp` stays a fresh
# tmpfs and the workspace is re-bound from the cwd, which is the part that makes the
# mask survivable.
#
# **A non-root caller now works — and on Ubuntu 23.10+/24.04 the host still has to say so.**
# The argv is built from `userns` below: `-U -r` needs no privilege and is what `auto` tries
# first, and `run()` uses the mechanism the probe actually proved. Measured on a `ubuntu-24.04`
# host kernel (`6.17.0-1022-azure`) as a non-root user: with
# `kernel.apparmor_restrict_unprivileged_userns=1` — the distribution default — the user
# namespace is refused, `probe()` answers `none`, and the refusal names that sysctl; with it set
# to `0` the same command is contained (`full`, `mechanism: map-root`, 48 passed / 0 skipped).
# On `ubuntu-22.04` no sysctl is involved at all, which is why the CI pin sits there and a
# separate job measures 24.04. Lowering it is a **host/deployment decision**, not something this
# process may do for itself.
#
# `probe()` asks the machine by *running* a trivial sandbox, not by checking for
# `unshare`: Ubuntu 24.04's default AppArmor policy blocks unprivileged user
# namespaces, so a presence check reports `full` on a host that cannot isolate
# anything — and `arm` trusts that number.
- id: sandbox
  plugin: forgepilot.providers.sandbox.namespace:NamespaceSandboxPlugin
  config:
    # How the boundary is entered, as a command line. `unshare` ships with
    # util-linux; `["bwrap", ...]` works too once bubblewrap is installed.
    enter: [unshare]
    # How that command-line obtains the capability, which is a separate question
    # from which program to run: `auto` asks the machine (`-U -r` first, which
    # needs no privilege; the shipped argv only when already root), `map-root`
    # always uses `-U -r`, `require-root` is the argv that needs CAP_SYS_ADMIN —
    # what a container that runs as root *is* entitled to. `auto` is not a guess:
    # the answer is the mechanism the probe actually ran, and a run is built from
    # that and nothing else.
    userns: auto
    # What this boundary claims about reads: `host` (writes confined, reads reach
    # the whole filesystem) or `workspace` (reads confined to the workspace).
    # Claiming more than the boundary enforces is refused, not ignored.
    read_scope: host
    max_output_bytes: 64000
  tier: trusted
