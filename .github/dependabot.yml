version: 2
# Both ecosystems, weekly, grouped.
#
# `pip` because the runtime is this machine's dependency tree — `cordis-port==0.1.5` is a
# 0.x alpha from a single maintainer and is the pin most worth watching. `github-actions`
# because the workflow runs with a repository token: an action is a dependency that executes
# with more authority than anything `pip` installs.
#
# Weekly rather than daily on purpose. A daily bump PR against an alpha kernel produces
# churn nobody reviews, and an unreviewed bump is worse than an old pin — the point is a PR
# someone reads, not a green badge.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
    # `cordis-port` is pinned deliberately: its releases ship no changelog beyond a compare
    # link, and its semantics (the 16 assertions in tests/kernel/) are what this project is
    # built on, so a version bump is a behavioural experiment rather than a maintenance
    # chore. Decided 2026-10-20 (0.1.5 -> 0.1.7 proposed, not taken): the diff touched
    # `fiber.py` (+102/-52) and the `events.py` hook-disposal path — the two places the
    # kernel contract exists to pin. Revisit by running `tests/kernel/`, `--kernel-check`,
    # `--boot` and `tools/check.py` against the new version on a branch; until that happens
    # the bot should not keep proposing it.
    ignore:
      - dependency-name: "cordis-port"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      workflow-actions:
        patterns: ["*"]
