# ForgePilot base bundle — the seam wiring every profile inherits.
#
# Rows marked `disabled: true` name the plugin that will fill the seam but whose
# implementation has not landed yet. They stay in the file rather than being
# omitted, so `--dump-config` shows the intended shape and the gap is visible
# instead of implied.
#
# Swap a capability by overriding a row id in a later layer; never by editing a
# consumer. That is what makes the seam swappable.

# --- model -----------------------------------------------------------------
# Replay rather than a live model: deterministic, offline, no credentials. This
# is the provider CI runs against.
- id: llm
  plugin: forgepilot.providers.llm.replay:ReplayLLMPlugin
  config:
    model: replay-1
  tier: trusted

# --- code retrieval --------------------------------------------------------
# Local search is scoped to the branch diff plus uncommitted changes. In the
# target environment (GVFS: 300GB+, metadata-only locally) scanning the working
# tree would trigger unbounded on-demand downloads; on ordinary repos it simply
# does not scale. Either way, global search belongs to the remote provider below.
- id: retriever
  plugin: forgepilot.providers.retrieve.mock:MockRetrieverPlugin
  config:
    max_hits: 200
  tier: trusted

# The load-bearing global code search in the target design. Reuses the company's
# existing enterprise search service (full-text inverted index + semantic vector
# index) rather than rebuilding a per-developer index.
#
# Disabled because that service does not exist yet and the skeleton uses fixture
# repos. An enabled row pointing at a placeholder would be worse than an honest
# gap — flip this on when the endpoint is real.
- id: retriever-remote
  plugin: forgepilot.providers.retrieve.remote_index:RemoteIndexRetrieverPlugin
  disabled: true
  config:
    endpoint: ${FORGEPILOT_SEARCH_ENDPOINT:-http://search.invalid}
    # Every returned slice must carry its ref so callers can verify they are not
    # reading trunk while working on a branch.
    verify_ref: true
  tier: trusted

# --- work item and repository ---------------------------------------------
- id: tickets
  plugin: forgepilot.providers.tickets.mock:MockTicketSourcePlugin
  tier: trusted

- id: vcs
  plugin: forgepilot.providers.vcs.mock:MockVcsPlugin
  tier: trusted

- id: workspace
  plugin: forgepilot.providers.workspace.local:LocalTempWorkspacePlugin
  tier: trusted

# --- persistence -----------------------------------------------------------
- id: session
  plugin: forgepilot.providers.session_store.memory:InMemorySessionStorePlugin
  tier: trusted

- id: memory
  plugin: forgepilot.providers.memory.memory:InMemoryMemoryStorePlugin
  tier: trusted

# --- execution and safety --------------------------------------------------
# Reports `none` enforcement and records calls without executing them. A real
# host-backed provider must replace this before anything runs a command, and
# profiles that require containment must refuse to start while enforcement is
# weaker than `full`.
- id: sandbox
  plugin: forgepilot.providers.sandbox.recording:RecordingSandboxPlugin
  config:
    mode: workspace-write
    network: deny
    enforcement: none
  tier: trusted

- id: approval
  plugin: forgepilot.providers.approval.scripted:ScriptedApprovalPlugin
  config:
    # fail-closed: an unanswered ask is a refusal.
    policy: ask
  tier: trusted

# --- not yet implemented ---------------------------------------------------
# These name the intended implementation so the seam is visible in the dump.

# M4 — the tool pipeline and registry.
- id: tools
  plugin: forgepilot.runtime.tools.registry:ToolRegistryPlugin
  disabled: true
  tier: trusted

# M6 — the agent loop, selected through a factory key so the engine is a config
# change rather than a refactor.
- id: agent-loop
  plugin: forgepilot.runtime.loop.agent_loop:ForgePilotAgentLoopPlugin
  disabled: true
  config:
    factory: forgepilot
  tier: trusted
