# The same bug as `../../tickets/BUG-1.yaml`, naming the GitHub repository.
#
# ⚠️ The repository line is load-bearing. `preprocess` scans the ticket against
# the project's *known* repositories and nothing else, so a ticket that names a
# repository nobody configured finds no target and stops at AWAITING_INFO with
# "no repository could be determined" — before the classifier is ever consulted.
