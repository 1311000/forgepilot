# Same project as `../project.yaml`, pointed at GitHub.
#
# The repository slug is the one thing that has to change: ticket text is scanned
# against this list and nothing else, so a ticket naming `github.com/...` against
# a project that only knows `git.local/...` would find no repository and stop
# before the classifier.

name: stat-fix-github

repos:
  - github.com/1311000/test

repo_prefixes:
  - github.com/1311000/*

default_branch: main

test:
  - ${FORGEPILOT_PYTHON} -m pytest -q

allowed_operations:
  - read_code
  - write_code
  - run_tests
  - read_ticket
  - open_pr

writable_paths:
  - "."

# `allow` for the same reason as `examples/stat-fix/project.yaml`: this deployment
# runs checks through `bundles/local_exec`, which contains nothing, and a backend
# that cannot deny the network refuses a policy that asks it to rather than
# accepting it and ignoring it. A host with the namespace sandbox keeps `deny`.
network: allow

retry:
  max_attempts: 2
  on_failure: stop

# The check's own oracle — restored to the base revision while the checks run, so
# a relaxed assertion cannot be what makes them pass. See
# `runtime/pinning.py`. The value below is the default; it is written out because
# on this example it is not hypothetical: the repository the agent works in is a
# real one somebody can go and read.
test_paths:
  - tests/
  - "test_*.py"
  - conftest.py

tool_sets:
  default:
    - read_file
    - code_search
  bugfix:
    - read_file
    - code_search
    - write_file
    # The targeted replace; see `configs/projects/example/project.yaml`.
    - edit_file
    - run

category_tool_sets:
  bug: bugfix
  question: default

budget:
  max_tool_calls: 60
  max_tokens: 200000
