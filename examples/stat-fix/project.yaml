# What this project is, and what it permits. Read by `forgepilot --task`.
#
# `${VAR}` is expanded here exactly as it is in a profile's plugin config — see
# `load_project`. It earns its place in this file for a reason it does not have in
# a profile: a `test:` command is a *machine's* business. The interpreter that has
# pytest differs per developer, and this file is one a team checks in.

name: stat-fix

# The repositories this project is. Ticket text is scanned against this list and
# nothing else — extracting an arbitrary `owner/repo` would let a ticket name a
# repository nobody authorised and the router would treat it as in scope.
repos:
  - git.local/demo/stats

repo_prefixes:
  - git.local/demo/*

default_branch: main

# What the harness runs to decide whether a change is any good. Each entry is its
# own process, run in order, stopping at the first failure — **not** a shell line,
# so `&&`, `|` and redirection do not work here and are not meant to.
test:
  - ${FORGEPILOT_PYTHON} -m pytest -q

# What a task may do. Absent means "nothing", not "everything": a project that
# forgot to say is not thereby an open project.
allowed_operations:
  - read_code
  - write_code
  - run_tests
  - read_ticket

# `"."` means the whole checkout. Note that this is the *caller's* writable set
# after intersection — the sandbox's own root is the workspace, and this cannot
# widen it.
writable_paths:
  - "."

# ⚠️ **`allow`, not `deny`, and the reason is the sandbox rather than the network.**
# This example runs commands through `bundles/local_exec`, which contains nothing at
# all. A backend that cannot deny the network now *refuses* a policy that asks it to
# (see `providers/sandbox/local.py`), so `deny` here would refuse every check rather
# than restrict one. `allow` is not a relaxation of a working boundary — it is the
# honest description of a command this backend was always going to run uncontained,
# and it is what the model's scope section now tells it. A real deployment on a host
# with the namespace sandbox keeps `deny` and gets it enforced.
network: allow

retry:
  max_attempts: 2
  on_failure: stop

# Which changed paths are the check's own oracle.
#
# A path matching one of these is restored to the task's base revision while the
# checks run, so an edit to it cannot be what makes them pass. The agent's edit is
# kept and stays in the diff — it just does not decide the verdict. Without this,
# "the tests pass" means one thing when the code was fixed and another when the
# assertion was relaxed, and nothing in the harness can tell them apart.
#
# The value here is the default; a project whose tests live elsewhere says so.
# An explicit empty list means "pin nothing".
test_paths:
  - tests/
  - "test_*.py"
  - conftest.py

# Which tools a category runs with. The classifier picks a *name*; what that name
# means is decided here — which is what bounds a model's influence over tool
# selection to "choose one of the sets someone already approved". A category with
# no entry falls back to `default`, never to everything.
tool_sets:
  # A question is answered by reading and searching; it needs no write access.
  default:
    - read_file
    - list_dir
    - glob
    - code_search
    - read_code
  bugfix:
    - read_file
    - list_dir
    - glob
    - code_search
    - read_code
    - write_file
    # See `configs/projects/example/project.yaml`: `edit_file` is the targeted
    # replace, and the one to prefer for a change to an existing file.
    - edit_file
    # The same exact-match edit, but several places at once and all-or-nothing.
    - apply_patch
    # The plan, recorded where the log can see it. Not in `default`: a question
    # needs no write access, and this tool does write — to the session.
    - todo_write
    - run

category_tool_sets:
  bug: bugfix
  question: default
  # ⚠️ The classifier's categories are ("bug", "question", "feature") and until an
  # eval task used one, `feature` had no entry here — so a feature ticket fell
  # back to `default`, which is read-only, and the agent could not write anything.
  # The fallback is right (never "everything"), but a category the classifier can
  # actually emit needs a set that can do the work.
  feature: bugfix

budget:
  max_tool_calls: 60
  max_tokens: 200000
