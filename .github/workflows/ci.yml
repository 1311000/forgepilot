# ✅ **This workflow has run.** The first real run — 38139694497, on the push that gave the
# repository its remote — was **green in both jobs, 42 s and 43 s**: `ruff` clean,
# `1053 passed, 217 skipped`, 922 of 7718 statements missed (**88.05%** against the 85 bar),
# `All gates passed.` in `check`; the container suite `2 passed`, `--sandbox-check` exiting 1
# for the default profile and 0 where containment is real, and `31 passed, 1 skipped` in
# `sandbox`. It has been green on every push since, and the most recent one — 38140873105, on
# the force-push that carried the rewritten history — is the first whose `check` counts differ:
# **`1045 passed, 218 skipped`**, because `CLAUDE.md` is no longer in the checkout and the guard
# over it skips as a single module instead of running its eight assertions. Coverage is
# unchanged at 88.05%: those assertions are about prose, not statements.
# See `docs/notes/gates-on-linux.md`. The workflow is deliberately thin: install
# the package and call the same entry a person calls (`tools/check.py`), so a local green run
# and a CI green run cannot be measuring different things.
#
# ⚠️ **The first run was green; the one skip in it is a finding, and it is the one this file
# predicted.** `test_a_write_outside_the_workspace_is_refused` — the test the namespace
# provider exists for — is hardcoded to the `wsl` transport, so on the runner it skips with a
# reason that names the transport rather than the kernel, exactly as its docstring said the
# first Linux run would confirm. The real-kernel evidence therefore comes from the
# `--privileged` container step, whose suite *does* execute. A later skip for a *different*
# reason is a finding about code that was previously only asserted about, not a broken
# pipeline — the `sandbox` job's step is named for that.
#
# ⚠️ **`runs-on` is pinned rather than `-latest`, and the pin is not cosmetic.** The
# runner image decides the kernel's namespace policy, and a *security* claim about the
# sandbox rests on it — `ubuntu-latest` moving from 22.04 to 24.04 would change what a
# green run means, with no edit to this repository. What the pin means in practice was
# settled by the first run: the native boundary is not exercised on `ubuntu-22.04` (the
# skip above), so the `sandbox` job's container step is where containment is executed, and
# whether an unprivileged runner could run the native transport at all stays open — see
# `CLAUDE.md` under "The runner is pinned".
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The **declared floor** (`requires-python = ">=3.12"`) rather than the
          # development box's 3.14: the gate should hold on the oldest interpreter a
          # deployment is allowed to use. A 3.14 job can be added when the runners have
          # it; adding one now would produce a red build for a reason that has nothing
          # to do with the change, and a gate that fails for an unrelated reason is a
          # gate people stop reading.
          python-version: "3.12"

      - run: python -m pip install --upgrade pip

      # ⚠️ `web` and `ast` are installed **on purpose**, and leaving them out is not a
      # neutral choice. With only `[dev]`:
      #   * `tests/httpapi/conftest.py:28` does `pytest.importorskip("fastapi")`, so the
      #     whole HTTP/SSE surface — M10's routing, auth and streaming tests — skips on
      #     the platform that *has* it installed locally (this Windows box has fastapi,
      #     uvicorn and sse-starlette), i.e. the production platform would run *less*
      #     than the dev box;
      #   * `tests/review/test_review_mode.py:356-364` skips the AST test without
      #     tree-sitter, and tree-sitter publishes no Windows cp314 wheel — so the AST
      #     path would run *nowhere at all*, which is what the header above claims this
      #     workflow fixes.
      # First run of this job is the verification of that claim.
      - run: python -m pip install -e ".[dev,web,ast]"

      - run: python tools/check.py

  # `tools/check.py` runs the whole suite, so it *does* collect the sandbox tests — and
  # on a runner they come out as **skips**, which is the failure mode this job exists to
  # make visible: a check that cannot run is not a pass, and a green gate that rested on
  # those skips would be claiming containment nothing had verified.
  #
  # ⚠️ Until the reorder recorded in `CLAUDE.md` (N1) they did not even skip: the test
  # prepared its workspace over `wsl` *before* reaching its own probe guard, so on Linux
  # it raised `FileNotFoundError` — this job would have died before printing the very
  # reason it exists to print, and the `check` job would have gone red on a test that
  # measured nothing. Written, not yet run: the first run here is what says so.
  sandbox:
    runs-on: ubuntu-22.04
    env:
      # `tests/providers/test_namespace_sandbox_container.py` is gated on this (and on
      # `docker version` succeeding). It is the instrument that *can* verify containment
      # on a runner: it enters a real Linux kernel through a privileged container rather
      # than trying to create namespaces as the unprivileged `runner` user. The image
      # needs util-linux `mount` (busybox's fails with `can't find /etc in /proc/mounts`);
      # `ubuntu:24.04` already carries it, so nothing is downloaded. ⚠️ `redis:7.4.2-alpine`
      # was the earlier choice and installs it with `apk`: measured, when the CDN is not
      # reachable that does not fail, it hangs for the whole 600 s `subprocess` timeout, so
      # the failure reads as a sandbox verdict rather than as a missing package.
      FORGEPILOT_SANDBOX_CONTAINER: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: containment, against a real kernel (privileged container)
        run: python -m pytest tests/providers/test_namespace_sandbox_container.py -v

      # ⚠️ **The invariant that holds on every host.** The default profile's sandbox is the
      # *recording* one: it never executes, so it enforces nothing, and `--sandbox-check`
      # must refuse it. This is the failure mode the command exists to catch — `--boot`
      # reports that the row **loaded**, which is a different claim, and the kernel-sandbox
      # row loaded for as long as its boundary confined writes and not reads (finding 20).
      - name: the check refuses a sandbox that enforces nothing
        run: |
          if python -m forgepilot --config-dir configs --sandbox-check; then
            echo "::error::--sandbox-check passed for the recording sandbox, which never executes"
            exit 1
          fi

      # ⚠️ **And where containment is real, it must pass** — the same command, the same exit
      # status an operator's pipeline reads. Measured on this recipe before it was written
      # here (`.tmp/p2_sandbox_check.sh`, `ubuntu:24.04 --privileged`): `read_scope: host`
      # and `read_scope: workspace` both print `probe: full`, run the shell command, and
      # exit 0, while the default profile exits 1. The in-container install is deliberate:
      # a venv outside the boundary's named toolchain set is masked, so a check command
      # would die `command not found` rather than report anything.
      - name: the same check where containment is real (privileged container)
        run: |
          docker run --rm --privileged -v "$PWD:/src:ro" ubuntu:24.04 bash -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq python3 python3-venv util-linux >/dev/null
            mkdir -p /w && tar -C /src -cf - . | tar -C /w -xf -
            cd /w
            python3 -m venv /v
            /v/bin/pip install -q -e ".[dev]"
            /v/bin/python -m forgepilot --config-dir configs \
              --patch src/forgepilot/bundles/kernel_sandbox/patch.yaml --sandbox-check
          '

      # ⚠️ **A `SKIPPED` here is a finding, not a pass.** `-rs` prints the reason, and the
      # first run supplied it: `31 passed, 1 skipped`, the skip naming the **transport** —
      # `no namespace boundary on this host: the transport 'wsl' is missing` — rather than
      # the kernel. That was one of the two candidates recorded in `CLAUDE.md`; the other
      # (`build_argv` builds mount/pid/net namespaces with no user namespace, so it needs
      # root or `CAP_SYS_ADMIN`) is the reason a different transport is not a config change.
      # Read the reason before reading anything into a green job.
      - name: the native kernel sandbox (a skip here is not a pass)
        run: python -m pytest tests/providers/test_namespace_sandbox.py -v -rs
